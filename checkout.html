<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - ShopHub</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="main-header"></div>

  <main class="container" style="padding-top:20px;padding-bottom:40px">
    <div class="breadcrumb">
      <a href="index.html">Home</a>
      <span class="breadcrumb-sep"><i class="fas fa-chevron-right"></i></span>
      <a href="cart.html">Cart</a>
      <span class="breadcrumb-sep"><i class="fas fa-chevron-right"></i></span>
      <span class="breadcrumb-current">Checkout</span>
    </div>
    <h1 class="page-title">🔒 Secure Checkout</h1>

    <div id="checkout-content"></div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/checkout.js"></script>
  <script src="assets/js/dashboard.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    let appliedDiscount = 0;
    let appliedCoupon = null;
    let selectedPayment = 'credit_card';

    document.addEventListener('DOMContentLoaded', function() {
      const cart = getCart();
      if (!cart.length) { window.location.href = 'cart.html'; return; }
      renderCheckout();
    });

    function renderCheckout() {
      const user = getCurrentUser();
      const cart = getCart();
      const summary = getCartSummary(appliedDiscount);

      document.getElementById('checkout-content').innerHTML = `
        <div class="checkout-layout">
          <div class="checkout-form-wrap">
            <!-- Steps -->
            <div class="checkout-steps">
              <div class="checkout-step">
                <span class="step-num done"><i class="fas fa-check"></i></span>
                <span class="step-label">Cart</span>
              </div>
              <div class="step-line done"></div>
              <div class="checkout-step">
                <span class="step-num active">2</span>
                <span class="step-label active">Checkout</span>
              </div>
              <div class="step-line"></div>
              <div class="checkout-step">
                <span class="step-num">3</span>
                <span class="step-label">Confirmation</span>
              </div>
            </div>

            <!-- Contact Info -->
            <div class="form-section">
              <div class="form-section-title"><i class="fas fa-user"></i> Contact Information</div>
              <div class="form-grid">
                <div class="form-group">
                  <label>Full Name *</label>
                  <input type="text" id="full-name" class="form-control" placeholder="Juan dela Cruz" value="${user ? user.name : ''}" required>
                </div>
                <div class="form-group">
                  <label>Email Address *</label>
                  <input type="email" id="email" class="form-control" placeholder="juan@example.com" value="${user ? user.email : ''}" required>
                </div>
                <div class="form-group">
                  <label>Phone Number *</label>
                  <input type="tel" id="phone" class="form-control" placeholder="09171234567" value="${user && user.phone ? user.phone : ''}" required>
                </div>
              </div>
            </div>

            <!-- Shipping Address -->
            <div class="form-section">
              <div class="form-section-title"><i class="fas fa-map-marker-alt"></i> Shipping Address</div>
              <div class="form-grid">
                <div class="form-group form-full">
                  <label>Street Address *</label>
                  <input type="text" id="street" class="form-control" placeholder="House #, Street, Barangay" value="${user && user.address ? user.address.street : ''}" required>
                </div>
                <div class="form-group">
                  <label>City/Municipality *</label>
                  <input type="text" id="city" class="form-control" placeholder="Manila" value="${user && user.address ? user.address.city : ''}" required>
                </div>
                <div class="form-group">
                  <label>Province *</label>
                  <input type="text" id="province" class="form-control" placeholder="Metro Manila" value="${user && user.address ? user.address.province : ''}" required>
                </div>
                <div class="form-group">
                  <label>ZIP Code *</label>
                  <input type="text" id="zip" class="form-control" placeholder="1000" value="${user && user.address ? user.address.zip : ''}" required>
                </div>
                <div class="form-group">
                  <label>Country</label>
                  <input type="text" id="country" class="form-control" value="Philippines" readonly>
                </div>
              </div>
            </div>

            <!-- Payment Method -->
            <div class="form-section">
              <div class="form-section-title"><i class="fas fa-credit-card"></i> Payment Method</div>
              <div class="payment-options">
                <label class="payment-option selected" id="pay-credit-card" onclick="selectPayment('credit_card', this)">
                  <input type="radio" name="payment" value="credit_card" checked>
                  <span class="payment-icon">💳</span>
                  <div>
                    <div class="payment-label">Credit / Debit Card</div>
                    <div class="payment-desc">Visa, Mastercard, JCB</div>
                  </div>
                </label>
                <label class="payment-option" id="pay-gcash" onclick="selectPayment('gcash', this)">
                  <input type="radio" name="payment" value="gcash">
                  <span class="payment-icon">📱</span>
                  <div>
                    <div class="payment-label">GCash</div>
                    <div class="payment-desc">Pay via GCash mobile wallet</div>
                  </div>
                </label>
                <label class="payment-option" id="pay-maya" onclick="selectPayment('maya', this)">
                  <input type="radio" name="payment" value="maya">
                  <span class="payment-icon">💜</span>
                  <div>
                    <div class="payment-label">Maya (PayMaya)</div>
                    <div class="payment-desc">Pay via Maya digital wallet</div>
                  </div>
                </label>
                <label class="payment-option" id="pay-cod" onclick="selectPayment('cod', this)">
                  <input type="radio" name="payment" value="cod">
                  <span class="payment-icon">🏠</span>
                  <div>
                    <div class="payment-label">Cash on Delivery</div>
                    <div class="payment-desc">Pay when your order arrives</div>
                  </div>
                </label>
              </div>
              <div id="card-fields" style="margin-top:16px">
                <div class="form-grid">
                  <div class="form-group form-full">
                    <label>Card Number</label>
                    <input type="text" class="form-control" placeholder="1234 5678 9012 3456" maxlength="19" oninput="formatCardNumber(this)">
                  </div>
                  <div class="form-group">
                    <label>Expiry Date</label>
                    <input type="text" class="form-control" placeholder="MM/YY" maxlength="5">
                  </div>
                  <div class="form-group">
                    <label>CVV</label>
                    <input type="text" class="form-control" placeholder="123" maxlength="3">
                  </div>
                  <div class="form-group form-full">
                    <label>Cardholder Name</label>
                    <input type="text" class="form-control" placeholder="Juan dela Cruz">
                  </div>
                </div>
              </div>
            </div>

            <!-- Notes -->
            <div class="form-section">
              <div class="form-group">
                <label>Order Notes (Optional)</label>
                <textarea id="order-notes" class="form-control" rows="3" placeholder="Special instructions for your order..."></textarea>
              </div>
            </div>

            <button class="btn btn-primary btn-full btn-lg" onclick="placeOrder()">
              <i class="fas fa-lock"></i> Place Order · ${formatPrice(summary.total)}
            </button>
            <p style="text-align:center;font-size:0.8rem;color:var(--text-muted);margin-top:10px">
              <i class="fas fa-shield-alt"></i> Your payment information is encrypted and secure
            </p>
          </div>

          <!-- Order Summary -->
          <div class="order-summary-box">
            <h3 style="font-size:1rem;font-weight:700;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)">Order Summary</h3>
            <div class="order-items-list">
              ${cart.map(item => `
                <div class="order-item">
                  <img src="${item.image}" onerror="this.src='https://picsum.photos/seed/default/60/60'" alt="">
                  <div class="order-item-info">
                    <div class="order-item-name">${item.name}</div>
                    <div class="order-item-qty">Qty: ${item.quantity}</div>
                  </div>
                  <span class="order-item-price">${formatPrice(item.price * item.quantity)}</span>
                </div>
              `).join('')}
            </div>
            <div class="coupon-form">
              <input type="text" id="coupon-input" placeholder="Coupon code" maxlength="20" style="text-transform:uppercase" value="${appliedCoupon ? appliedCoupon.code : ''}">
              <button class="btn-apply-coupon" onclick="applyCoupon()">Apply</button>
            </div>
            ${appliedCoupon ? `<div class="alert alert-success" style="padding:8px 12px;font-size:0.82rem;margin-bottom:8px"><i class="fas fa-tag"></i> ${appliedCoupon.description}</div>` : ''}
            <div class="divider"></div>
            <div class="summary-row"><span>Subtotal</span><span>${formatPrice(summary.subtotal)}</span></div>
            <div class="summary-row"><span>Shipping</span><span>${summary.shipping === 0 ? '<span style="color:var(--success)">FREE</span>' : formatPrice(summary.shipping)}</span></div>
            ${appliedDiscount > 0 ? `<div class="summary-row" style="color:var(--success)"><span><i class="fas fa-tag"></i> Discount</span><span>-${formatPrice(appliedDiscount)}</span></div>` : ''}
            <div class="summary-row total"><span>Total</span><span id="checkout-total">${formatPrice(summary.total)}</span></div>
          </div>
        </div>
      `;
    }

    function selectPayment(method, el) {
      selectedPayment = method;
      document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      document.getElementById('card-fields').style.display = method === 'credit_card' ? 'block' : 'none';
    }

    function formatCardNumber(input) {
      let v = input.value.replace(/\D/g,'').substring(0,16);
      input.value = v.replace(/(.{4})/g,'$1 ').trim();
    }

    function applyCoupon() {
      const code = document.getElementById('coupon-input').value.trim();
      if (!code) return;
      const result = applyDiscount(code, getCartSubtotal());
      if (result.success) {
        appliedDiscount = result.discountAmount;
        appliedCoupon = result.coupon;
        showNotification(`Coupon applied! Saved ${formatPrice(result.discountAmount)}`, 'success');
        renderCheckout();
      } else {
        showNotification(result.message, 'error');
      }
    }

    function validateForm() {
      const required = ['full-name', 'email', 'phone', 'street', 'city', 'province', 'zip'];
      for (const id of required) {
        const el = document.getElementById(id);
        if (!el || !el.value.trim()) {
          showNotification('Please fill in all required fields.', 'error');
          el && el.focus();
          return false;
        }
      }
      const email = document.getElementById('email').value;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showNotification('Please enter a valid email address.', 'error');
        return false;
      }
      return true;
    }

    function placeOrder() {
      if (!validateForm()) return;
      const cart = getCart();
      const summary = getCartSummary(appliedDiscount);
      const orderData = {
        items: cart,
        subtotal: summary.subtotal,
        shipping: summary.shipping,
        discount: appliedDiscount,
        total: summary.total,
        shippingAddress: {
          name: document.getElementById('full-name').value,
          street: document.getElementById('street').value,
          city: document.getElementById('city').value,
          province: document.getElementById('province').value,
          zip: document.getElementById('zip').value,
          phone: document.getElementById('phone').value,
          country: 'Philippines'
        },
        paymentMethod: selectedPayment,
        couponCode: appliedCoupon ? appliedCoupon.code : null
      };
      const order = createOrder(orderData);
      showNotification('Order placed successfully! Redirecting...', 'success');
      setTimeout(() => { window.location.href = 'order-confirmation.html'; }, 1000);
    }
  </script>
</body>
</html>
