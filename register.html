<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - ShopHub</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card" style="max-width:480px">
      <div class="auth-logo">
        <a href="index.html">🛍️ ShopHub</a>
      </div>
      <h2 class="auth-title">Create an Account</h2>
      <p class="auth-subtitle">Join thousands of shoppers on ShopHub</p>

      <div id="error-msg"></div>

      <form id="register-form" onsubmit="handleRegister(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>First Name *</label>
            <input type="text" id="first-name" class="form-control" placeholder="Juan" required>
          </div>
          <div class="form-group">
            <label>Last Name *</label>
            <input type="text" id="last-name" class="form-control" placeholder="dela Cruz" required>
          </div>
        </div>
        <div class="form-group">
          <label>Email Address *</label>
          <div class="input-group">
            <input type="email" id="reg-email" class="form-control" placeholder="juan@example.com" required>
            <i class="fas fa-envelope input-group-icon"></i>
          </div>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="09171234567">
        </div>
        <div class="form-group">
          <label>Password *</label>
          <div class="input-group">
            <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" minlength="6" required oninput="checkPasswordStrength()">
            <i class="fas fa-eye input-group-icon" id="toggle-pass" onclick="togglePassword()" style="cursor:pointer"></i>
          </div>
          <div id="password-strength" style="margin-top:6px"></div>
        </div>
        <div class="form-group">
          <label>Confirm Password *</label>
          <input type="password" id="reg-confirm" class="form-control" placeholder="Repeat your password" required>
        </div>
        <div class="form-group">
          <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer">
            <input type="checkbox" id="agree-terms" style="margin-top:2px;accent-color:var(--primary)" required>
            <span style="font-size:0.85rem">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
          </label>
        </div>
        <div class="form-group">
          <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer">
            <input type="checkbox" id="newsletter" style="margin-top:2px;accent-color:var(--primary)" checked>
            <span style="font-size:0.85rem">Subscribe to newsletters for deals & promotions</span>
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="register-btn">
          <i class="fas fa-user-plus"></i> Create Account
        </button>
      </form>

      <div class="auth-divider">or sign up with</div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-secondary btn-full" onclick="showNotification('Social login not available in demo','info')"><i class="fab fa-google"></i> Google</button>
        <button class="btn btn-secondary btn-full" onclick="showNotification('Social login not available in demo','info')"><i class="fab fa-facebook"></i> Facebook</button>
      </div>

      <div class="auth-footer">
        Already have an account? <a href="login.html" style="font-weight:700">Sign In</a>
      </div>
    </div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/checkout.js"></script>
  <script src="assets/js/dashboard.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      initializeData();
      if (isLoggedIn()) window.location.href = 'index.html';
    });

    function handleRegister(e) {
      e.preventDefault();
      const firstName = document.getElementById('first-name').value.trim();
      const lastName = document.getElementById('last-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;
      const errEl = document.getElementById('error-msg');
      errEl.innerHTML = '';

      if (!firstName || !lastName) { errEl.innerHTML = '<div class="alert alert-error">Please enter your full name.</div>'; return; }
      if (password.length < 6) { errEl.innerHTML = '<div class="alert alert-error">Password must be at least 6 characters.</div>'; return; }
      if (password !== confirm) { errEl.innerHTML = '<div class="alert alert-error">Passwords do not match.</div>'; return; }

      const btn = document.getElementById('register-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

      setTimeout(() => {
        const result = register({ name: firstName + ' ' + lastName, email, password, phone });
        if (result.success) {
          showNotification('Account created! Welcome to ShopHub! 🎉', 'success');
          setTimeout(() => { window.location.href = 'index.html'; }, 800);
        } else {
          errEl.innerHTML = `<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> ${result.message}</div>`;
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
        }
      }, 700);
    }

    function checkPasswordStrength() {
      const pass = document.getElementById('reg-password').value;
      const el = document.getElementById('password-strength');
      if (!pass) { el.innerHTML = ''; return; }
      let strength = 0;
      if (pass.length >= 8) strength++;
      if (/[A-Z]/.test(pass)) strength++;
      if (/[0-9]/.test(pass)) strength++;
      if (/[^A-Za-z0-9]/.test(pass)) strength++;
      const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
      const colors = ['', '#E74C3C', '#F39C12', '#27AE60', '#2ECC71'];
      el.innerHTML = `<div style="display:flex;align-items:center;gap:8px">
        <div style="display:flex;gap:3px">${[1,2,3,4].map(i => `<div style="width:24px;height:4px;border-radius:2px;background:${i<=strength?colors[strength]:'var(--gray-200)'}"></div>`).join('')}</div>
        <span style="font-size:0.78rem;color:${colors[strength]};font-weight:600">${labels[strength]}</span>
      </div>`;
    }

    function togglePassword() {
      const input = document.getElementById('reg-password');
      const icon = document.getElementById('toggle-pass');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash input-group-icon';
      } else {
        input.type = 'password';
        icon.className = 'fas fa-eye input-group-icon';
      }
    }
  </script>
</body>
</html>
