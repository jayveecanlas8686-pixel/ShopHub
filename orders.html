<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - ShopHub</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="main-header"></div>

  <main class="container" style="padding:20px 16px 40px">
    <div class="breadcrumb">
      <a href="index.html">Home</a>
      <span class="breadcrumb-sep"><i class="fas fa-chevron-right"></i></span>
      <a href="profile.html">Profile</a>
      <span class="breadcrumb-sep"><i class="fas fa-chevron-right"></i></span>
      <span class="breadcrumb-current">My Orders</span>
    </div>
    <h1 class="page-title"><i class="fas fa-box"></i> My Orders</h1>

    <!-- Filter Tabs -->
    <div class="tabs" id="order-tabs">
      <button class="tab-btn active" onclick="filterOrders('all', this)">All Orders</button>
      <button class="tab-btn" onclick="filterOrders('processing', this)">Processing</button>
      <button class="tab-btn" onclick="filterOrders('shipped', this)">Shipped</button>
      <button class="tab-btn" onclick="filterOrders('delivered', this)">Delivered</button>
      <button class="tab-btn" onclick="filterOrders('cancelled', this)">Cancelled</button>
    </div>

    <div id="orders-list">
      <div class="loading-spinner"><div class="spinner"></div></div>
    </div>
  </main>

  <div id="main-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/checkout.js"></script>
  <script src="assets/js/dashboard.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    let currentFilter = 'all';

    document.addEventListener('DOMContentLoaded', function() {
      renderFooter();
      if (!requireAuth()) return;
      renderOrders();
    });

    function filterOrders(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderOrders();
    }

    function renderOrders() {
      const user = getCurrentUser();
      let orders = getUserOrders(user.id);
      if (currentFilter !== 'all') orders = orders.filter(o => o.status === currentFilter);
      orders = orders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      const el = document.getElementById('orders-list');

      if (!orders.length) {
        el.innerHTML = `
          <div class="empty-cart" style="padding:60px 20px">
            <div class="empty-icon">📦</div>
            <h3>No orders found</h3>
            <p style="color:var(--text-muted);margin-bottom:20px">${currentFilter === 'all' ? "You haven't placed any orders yet." : `No ${currentFilter} orders.`}</p>
            <a href="products.html" class="btn btn-primary btn-lg"><i class="fas fa-shopping-bag"></i> Start Shopping</a>
          </div>
        `;
        return;
      }

      el.innerHTML = orders.map(order => `
        <div class="order-card">
          <div class="order-card-header">
            <div>
              <span style="font-weight:700;color:var(--primary)">${order.id}</span>
              <span style="font-size:0.8rem;color:var(--text-muted);margin-left:12px">${formatOrderDate(order.createdAt)}</span>
            </div>
            <div style="display:flex;align-items:center;gap:10px">
              ${getOrderStatusBadge(order.status)}
              <span style="font-weight:700;color:var(--primary)">${formatPrice(order.total)}</span>
            </div>
          </div>
          <div class="order-card-body">
            ${order.items.map(item => `
              <div class="order-item-card">
                <a href="product.html?id=${item.productId}">
                  <img src="${item.image}" alt="${item.name}" onerror="this.src='https://picsum.photos/seed/default/80/80'">
                </a>
                <div style="flex:1">
                  <a href="product.html?id=${item.productId}" style="font-weight:500;font-size:0.9rem;color:var(--text)">${item.name}</a>
                  <div style="font-size:0.8rem;color:var(--text-muted)">Qty: ${item.quantity} · ${formatPrice(item.price)} each</div>
                </div>
                <span style="font-weight:700">${formatPrice(item.price * item.quantity)}</span>
              </div>
            `).join('')}
          </div>
          <div class="order-card-footer">
            <div style="font-size:0.85rem;color:var(--text-muted)">
              <i class="fas fa-truck"></i> Est. delivery: ${formatDate(order.estimatedDelivery)}
              · Tracking: <strong>${order.trackingNumber}</strong>
            </div>
            <div style="display:flex;gap:8px">
              ${['processing','pending'].includes(order.status) ? `<button class="btn btn-danger" style="padding:6px 14px;font-size:0.85rem" onclick="cancelMyOrder('${order.id}')"><i class="fas fa-times"></i> Cancel</button>` : ''}
              ${order.status === 'delivered' ? `<a href="products.html" class="btn btn-outline" style="padding:6px 14px;font-size:0.85rem"><i class="fas fa-redo"></i> Buy Again</a>` : ''}
              <button class="btn btn-secondary" style="padding:6px 14px;font-size:0.85rem" onclick="viewOrderDetails('${order.id}')"><i class="fas fa-eye"></i> Details</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function cancelMyOrder(orderId) {
      if (confirm('Are you sure you want to cancel this order?')) {
        const result = cancelOrder(orderId);
        if (result.success) {
          showNotification('Order cancelled successfully.', 'success');
          renderOrders();
        } else {
          showNotification(result.message, 'error');
        }
      }
    }

    function viewOrderDetails(orderId) {
      const order = getOrder(orderId);
      if (!order) return;
      const paymentLabels = { credit_card: '💳 Credit Card', gcash: '📱 GCash', maya: '💜 Maya', cod: '🏠 Cash on Delivery' };
      const addr = order.shippingAddress;
      openModal(`
        <div style="font-size:0.9rem">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
            <div><strong>Order ID:</strong><br>${order.id}</div>
            <div><strong>Status:</strong><br>${getOrderStatusBadge(order.status)}</div>
            <div><strong>Date:</strong><br>${formatOrderDate(order.createdAt)}</div>
            <div><strong>Payment:</strong><br>${paymentLabels[order.paymentMethod]||order.paymentMethod}</div>
          </div>
          <div style="border-top:1px solid var(--border);padding-top:12px;margin-bottom:12px">
            <strong>Shipping To:</strong>
            <p style="color:var(--text-muted);margin-top:4px">${addr ? `${addr.name} · ${addr.street}, ${addr.city}, ${addr.province} ${addr.zip} · ${addr.phone}` : '—'}</p>
          </div>
          <div style="border-top:1px solid var(--border);padding-top:12px">
            <strong>Items:</strong>
            ${order.items.map(item => `
              <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--gray-100)">
                <span>${item.name} × ${item.quantity}</span>
                <span style="font-weight:600;color:var(--primary)">${formatPrice(item.price * item.quantity)}</span>
              </div>
            `).join('')}
            <div style="display:flex;justify-content:space-between;padding:8px 0"><span>Subtotal</span><span>${formatPrice(order.subtotal)}</span></div>
            <div style="display:flex;justify-content:space-between;padding:8px 0"><span>Shipping</span><span>${order.shipping === 0 ? 'FREE' : formatPrice(order.shipping)}</span></div>
            ${order.discount > 0 ? `<div style="display:flex;justify-content:space-between;padding:8px 0;color:var(--success)"><span>Discount</span><span>-${formatPrice(order.discount)}</span></div>` : ''}
            <div style="display:flex;justify-content:space-between;font-size:1.1rem;font-weight:800;padding:10px 0;border-top:2px solid var(--border);color:var(--primary)"><span>Total</span><span>${formatPrice(order.total)}</span></div>
          </div>
        </div>
      `, 'Order Details: ' + order.id);
    }
  </script>
</body>
</html>
