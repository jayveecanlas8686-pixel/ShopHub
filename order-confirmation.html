<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed - ShopHub</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="main-header"></div>

  <main class="container" style="padding:40px 16px">
    <div id="confirmation-content">
      <div class="loading-spinner"><div class="spinner"></div></div>
    </div>
  </main>

  <div id="main-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/checkout.js"></script>
  <script src="assets/js/dashboard.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      renderFooter();
      const order = getLastOrder();
      if (!order) { window.location.href = 'index.html'; return; }
      renderConfirmation(order);
    });

    function renderConfirmation(order) {
      const paymentLabels = {
        credit_card: '💳 Credit/Debit Card',
        gcash: '📱 GCash',
        maya: '💜 Maya',
        cod: '🏠 Cash on Delivery'
      };
      const addr = order.shippingAddress;

      document.getElementById('confirmation-content').innerHTML = `
        <div class="order-confirm-wrap">
          <div class="order-confirm-icon">✅</div>
          <h1>Order Confirmed!</h1>
          <p style="color:var(--text-muted);font-size:1rem">Thank you for your order! We've sent a confirmation to ${addr ? addr.name : 'you'}.</p>
          <div class="order-number">
            <i class="fas fa-receipt" style="color:var(--primary)"></i>
            <span>Order ID: <strong>${order.id}</strong></span>
          </div>
          <div style="background:var(--gray-50);border-radius:var(--radius-lg);padding:16px;margin-bottom:20px;text-align:left">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:0.9rem">
              <i class="fas fa-clock" style="color:var(--primary)"></i>
              <span>Placed on: <strong>${formatOrderDate(order.createdAt)}</strong></span>
            </div>
            <div style="display:flex;align-items:center;gap:10px;font-size:0.9rem">
              <i class="fas fa-truck" style="color:var(--success)"></i>
              <span>Estimated delivery: <strong>${formatDate(order.estimatedDelivery)}</strong></span>
            </div>
          </div>

          <div class="order-details-grid">
            <div class="order-detail-card">
              <h4><i class="fas fa-map-marker-alt"></i> Shipping To</h4>
              <p>${addr ? addr.name : '—'}</p>
              <p style="color:var(--text-muted);font-size:0.85rem;margin-top:4px">${addr ? `${addr.street}, ${addr.city}, ${addr.province} ${addr.zip}` : '—'}</p>
              <p style="color:var(--text-muted);font-size:0.85rem">${addr ? addr.phone : ''}</p>
            </div>
            <div class="order-detail-card">
              <h4><i class="fas fa-credit-card"></i> Payment Method</h4>
              <p>${paymentLabels[order.paymentMethod] || order.paymentMethod}</p>
              <p style="color:var(--text-muted);font-size:0.85rem;margin-top:4px">Tracking: ${order.trackingNumber}</p>
              <p style="margin-top:8px">${getOrderStatusBadge(order.status)}</p>
            </div>
          </div>

          <!-- Items -->
          <div style="background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:20px;text-align:left">
            <div style="padding:14px 16px;background:var(--gray-50);border-bottom:1px solid var(--border);font-weight:700;font-size:0.95rem">
              <i class="fas fa-box"></i> Items Ordered
            </div>
            ${order.items.map(item => `
              <div style="display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--gray-100);align-items:center">
                <img src="${item.image}" style="width:56px;height:56px;object-fit:cover;border-radius:var(--radius);flex-shrink:0" onerror="this.src='https://picsum.photos/seed/default/60/60'" alt="">
                <div style="flex:1">
                  <div style="font-weight:500;font-size:0.9rem">${item.name}</div>
                  <div style="font-size:0.8rem;color:var(--text-muted)">Qty: ${item.quantity}</div>
                </div>
                <span style="font-weight:700;color:var(--primary)">${formatPrice(item.price * item.quantity)}</span>
              </div>
            `).join('')}
            <div style="padding:12px 16px">
              <div style="display:flex;justify-content:space-between;font-size:0.9rem;padding:4px 0"><span>Subtotal</span><span>${formatPrice(order.subtotal)}</span></div>
              <div style="display:flex;justify-content:space-between;font-size:0.9rem;padding:4px 0"><span>Shipping</span><span>${order.shipping === 0 ? '<span style="color:var(--success)">FREE</span>' : formatPrice(order.shipping)}</span></div>
              ${order.discount > 0 ? `<div style="display:flex;justify-content:space-between;font-size:0.9rem;padding:4px 0;color:var(--success)"><span>Discount</span><span>-${formatPrice(order.discount)}</span></div>` : ''}
              <div style="display:flex;justify-content:space-between;font-size:1.1rem;font-weight:800;padding:8px 0;border-top:2px solid var(--border);margin-top:4px;color:var(--primary)"><span>Total Paid</span><span>${formatPrice(order.total)}</span></div>
            </div>
          </div>

          <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
            <a href="orders.html" class="btn btn-primary btn-lg"><i class="fas fa-box"></i> Track My Orders</a>
            <a href="index.html" class="btn btn-outline btn-lg"><i class="fas fa-home"></i> Continue Shopping</a>
          </div>

          <div style="margin-top:20px;padding:14px;background:var(--primary-bg);border-radius:var(--radius-lg);font-size:0.85rem;color:var(--text-light)">
            <p><strong>🎁 Thank you for shopping at ShopHub!</strong> Your order is being processed and will be shipped soon.</p>
            <p style="margin-top:6px">For questions, contact our support team. Check your orders page for real-time updates.</p>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
